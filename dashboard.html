<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SyncForge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <!-- Universal Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo" id="dashboard-logo">Sync<span>Forge</span></div>
            <nav id="sidebar-nav">
                <a href="#" class="active" id="nav-home">Overview</a>
                <a href="#" id="nav-students" style="display:none;">Student Details</a>
                <a href="#">Analytics</a>
                <a href="#">Integrations</a>
                <a href="#">Settings</a>
                <a href="index.html" class="logout" style="margin-top: auto; opacity: 0.7;">Sign Out</a>
            </nav>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Universal Top Nav -->
            <header class="topbar">
                <div class="client-info">
                    <h2 id="client-name">Loading...</h2>
                    <span class="status-badge green" id="system-status">System Online</span>
                </div>
                <div class="user-profile" style="display: flex; align-items: center; gap: 15px;">
                    <span id="breadcrumb" style="color: var(--text-muted); font-size: 14px;">Dashboard &gt; Overview</span>
                    <div class="avatar" style="width: 32px; height: 32px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center;">👤</div>
                </div>
            </header>

            <!-- Dynamic Content Container -->
            <div id="dashboard-content" class="dashboard-grid">
                <!-- JavaScript will inject widgets here based on selectedModule -->
            </div>
        </main>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
